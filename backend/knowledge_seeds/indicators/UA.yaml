code: UA
name: 尿酸
aliases:
- 血尿酸
- Serum Uric Acid
- SUA
unit: μmol/L
unit_conversions:
  mg/dL: 59.485
category: 肾功能
description: 尿酸是嘌呤代谢的终产物，主要通过肾脏排泄，是评估肾功能和嘌呤代谢状态的重要指标。
