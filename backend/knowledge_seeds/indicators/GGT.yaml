- sex: female
  age_min: 18
  age_max: 150
  low: 7
  high: 45
  critical_low: null
  critical_high: null
  source_note: 成人女性通用参考区间，基于多项临床指南及检验共识。女性水平通常低于男性。
high_suggests:
- condition: 胆道梗阻或胆汁淤积风险
  strength: strong
  note: GGT显著升高（通常>正常上限2-3倍）常提示肝内外胆管阻塞、胆汁淤积性肝病。
  description: 胆汁排泄受阻导致胆汁在肝内淤积，可引起GGT升高。
- condition: 酒精性肝病风险
  strength: strong
  note: 长期大量饮酒者GGT常明显升高，戒酒后可逐渐下降，是酒精性肝损伤的敏感指标。
  description: 长期过量饮酒导致的肝脏损伤。
- condition: 脂肪肝风险
  strength: medium
  note: 非酒精性脂肪性肝病常伴有GGT轻至中度升高，与代谢综合征相关。
  description: 肝细胞内脂肪过度沉积引起的肝脏病变。
- condition: 药物性肝损伤可能
  strength: medium
  note: 多种药物（如某些抗生素、抗癫痫药、他汀类等）可诱导肝酶合成或引起肝损伤，导致GGT升高。
  description: 由药物及其代谢产物引起的肝脏损伤。
- condition: 原发性或转移性肝癌风险
  strength: weak
  note: 肝癌患者GGT可升高，但特异性不高，需结合其他肿瘤标志物及影像学检查。
  description: 肝脏的恶性肿瘤，包括原发性和其他部位转移而来。
- condition: 胰腺疾病可能
  strength: weak
  note: 胰腺炎或胰腺肿瘤压迫胆总管时可引起GGT升高。
  description: 胰腺的炎症或肿瘤性疾病。
low_suggests: []
