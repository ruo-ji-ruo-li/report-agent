narrative: γ-谷氨酰转移酶（GGT）是肝胆系统疾病的重要血清标志物，尤其对胆道梗阻和酒精性肝损伤较为敏感。GGT升高可见于多种情况，从生理性波动（如饮酒、药物诱导）到病理性改变（如胆结石、肝炎、脂肪肝、肿瘤等）。轻度升高（<2倍正常上限）可能无显著临床意义，但需动态观察；显著升高（>3倍正常上限）则强烈提示肝胆疾病。GGT水平也受性别影响，男性通常高于女性。单次GGT升高不能确诊任何疾病，需结合其他肝功能指标（如ALT、AST、ALP、胆红素）及影像学检查综合评估。本内容不构成医学诊断。
