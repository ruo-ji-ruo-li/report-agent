code: GGT
name: γ-谷氨酰转移酶
aliases:
- γ-谷氨酰转肽酶
- 谷氨酰转肽酶
- GGTP
- Gamma-GT
unit: U/L
unit_conversions: {}
category: 肝功能
description: γ-谷氨酰转移酶是一种主要存在于肝脏、胆管和肾脏的酶，是评估肝胆系统疾病（尤其是胆道梗阻和酒精性肝损伤）的常用血清学指标。
ranges:
- sex: male
  age_min: 18
  age_max: 150
  low: 10
  high: 60
  critical_low: null
  critical_high: null
