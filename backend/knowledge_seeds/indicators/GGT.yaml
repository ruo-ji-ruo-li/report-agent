interventions:
- level: lifestyle
  text: 若近期有饮酒史，建议严格戒酒或暂停饮酒，避免高脂饮食，适度运动。
  timeframe: 2-4周
  departments: []
- level: recheck
  text: 若为轻度升高且无明显症状，建议在调整生活方式后复查肝功能（包括GGT、ALT、AST、ALP、胆红素等）。
  timeframe: 2-4周
  departments:
  - 消化内科
  - 肝病科
- level: specialist
  text: 若GGT持续升高或伴有乏力、黄疸、腹痛等症状，或合并其他肝功能指标异常，建议专科就诊，完善腹部超声等检查以明确病因。
  timeframe: 2周内
  departments:
  - 消化内科
  - 肝病科
- level: urgent
  text: 若GGT显著升高（如超过正常上限5倍以上）且伴有明显黄疸、腹痛、发热或陶土样大便，提示可能存在急性胆道梗阻，需尽快就医。
  timeframe: 立即或24小时内
  departments:
  - 急诊科
  - 消化内科
  - 肝胆外科
departments:
