narrative: 天冬氨酸氨基转移酶（AST）是反映肝细胞损伤的敏感指标，广泛存在于肝、心、骨骼肌等组织中。轻度升高（1-2倍正常上限）常见于脂肪肝、药物性肝损伤或非特异性波动，可能与近期饮酒、劳累、剧烈运动有关。显著升高（>10倍正常上限）多见于急性病毒性肝炎、缺血性肝损伤或药物性肝损伤。AST/ALT比值对鉴别病因有一定参考价值：酒精性肝病时比值常>1.5，病毒性肝炎时比值通常<1。此外，心肌梗死、肌肉疾病也可导致AST升高，需结合其他酶学指标综合判断。单次轻度升高不必过度紧张，建议复查并结合其他肝功能指标评估。本内容不构成医学诊断。
