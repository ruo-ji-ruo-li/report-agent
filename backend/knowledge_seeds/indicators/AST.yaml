- 心肌酶谱
interventions:
- level: lifestyle
  text: 避免饮酒，减少高脂饮食，规律作息，避免过度劳累和剧烈运动后立即检测。
  timeframe: null
  departments: []
- level: recheck
  text: 若轻度升高（<2倍上限），建议1-2周后复查肝功能，同时可加查ALT、GGT、ALP、胆红素等。
  timeframe: 1-2周
  departments:
  - 消化内科
  - 肝病科
- level: specialist
  text: 若持续升高或显著升高（>2倍上限），或伴有黄疸、乏力、食欲不振等症状，建议专科就诊进一步明确病因。
  timeframe: 2周内
  departments:
  - 消化内科
  - 肝病科
  - 感染科
- level: urgent
  text: 若AST急剧升高（>1000 U/L）或伴有严重黄疸、意识改变，需立即就医。
  timeframe: 立即
  departments:
  - 急诊科
  - 肝病科
