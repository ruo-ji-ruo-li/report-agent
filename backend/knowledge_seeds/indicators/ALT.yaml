narrative: 丙氨酸氨基转移酶（ALT）是肝细胞损伤的敏感标志物，主要存在于肝细胞浆中。当肝细胞受损时，ALT释放入血，导致血清水平升高。ALT升高程度与肝损伤严重程度相关，但并非完全平行。常见原因包括病毒性肝炎、酒精性肝病、非酒精性脂肪肝、药物性肝损伤、自身免疫性肝病等。轻度升高（<2倍正常上限）在健康人群中亦可见，可能与近期劳累、剧烈运动、饮食油腻等有关，建议复查。显著升高需警惕急性肝损伤。ALT降低通常无临床意义。本内容不构成医学诊断。
