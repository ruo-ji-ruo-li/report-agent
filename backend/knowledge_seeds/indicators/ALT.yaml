interventions:
- level: lifestyle
  text: 限制饮酒，均衡饮食，控制体重，避免高脂高糖食物，规律作息。
  timeframe: null
  departments: []
- level: recheck
  text: 若为轻度升高（<2倍上限），且无明显症状，建议1-2周后复查ALT，同时可加查AST、GGT、总胆红素等。
  timeframe: 1-2周
  departments:
  - 消化内科
  - 肝病科
- level: specialist
  text: 若复查仍持续升高，或升高超过2倍上限，或伴有乏力、食欲不振、黄疸等症状，建议专科就诊，进一步明确病因。
  timeframe: 2周内
  departments:
  - 消化内科
  - 肝病科
  - 感染科
- level: urgent
  text: 若ALT显著升高（>10倍上限）或伴有严重黄疸、凝血功能障碍等，需尽快就医。
  timeframe: 立即或24小时内
  departments:
