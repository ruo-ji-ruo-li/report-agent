high_suggests:
- condition: 肝细胞损伤可能
  strength: strong
  note: 轻度升高（1-2倍上限）可见于脂肪肝、药物、饮酒等；显著升高（>10倍上限）多见于急性病毒性肝炎、药物性肝损伤等。
  description: 各种原因导致的肝细胞受损，使ALT释放入血。
- condition: 非酒精性脂肪性肝病风险
  strength: medium
  note: 轻度升高且无其他明确原因时，需考虑脂肪肝可能，常与肥胖、高血脂、糖尿病等代谢因素相关。
  description: 肝细胞内脂肪堆积过多引起的慢性肝损伤。
- condition: 药物性肝损伤可能
  strength: medium
  note: 近期服用过某些药物（如对乙酰氨基酚、他汀类、某些抗生素等）或保健品，可能导致ALT升高。
  description: 药物或其代谢产物对肝脏的直接或间接损害。
- condition: 酒精性肝病可能
  strength: medium
  note: 长期大量饮酒可导致ALT升高，常伴有AST升高更明显。
  description: 长期过量饮酒导致的肝脏损害。
- condition: 病毒性肝炎可能
  strength: medium
  note: 急性或慢性病毒性肝炎（甲、乙、丙、戊等）活动期可出现ALT明显升高。
  description: 肝炎病毒感染引起的肝脏炎症。
