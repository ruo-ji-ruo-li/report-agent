code: TG
name: 甘油三酯
aliases:
- 三酰甘油
- Triglyceride
unit: mmol/L
unit_conversions:
  mg/dL: 0.0113
category: 血脂
description: 甘油三酯是血液中主要的脂质成分之一，主要参与能量代谢，其水平受饮食和遗传因素影响。
ranges:
- sex: any
  age_min: 18
  age_max: 150
  low: null
  high: 1.7
  critical_low: null
  critical_high: null
  source_note: 《中国血脂管理指南（2023年）》：TG < 1.7 mmol/L 为合适水平；1.7~2.3 mmol/L 为边缘升高；≥2.3 mmol/L
    为升高。
high_suggests:
- condition: 高甘油三酯血症
  strength: strong
  note: TG ≥ 2.3 mmol/L 可诊断高甘油三酯血症，需关注心血管风险。
  description: 血脂异常的一种，以甘油三酯水平升高为主要特征。
- condition: 动脉粥样硬化性心血管疾病风险
  strength: medium
  note: TG 升高与心血管疾病风险增加相关，但作为独立危险因素强度弱于低密度脂蛋白胆固醇。
  description: 因动脉粥样硬化导致的心脏、脑或外周血管疾病。
- condition: 急性胰腺炎风险
  strength: strong
  note: TG ≥ 5.6 mmol/L 时急性胰腺炎风险显著增加，需积极干预。
  description: 胰腺的急性炎症，严重时可危及生命。
- condition: 代谢综合征可能
  strength: medium
  note: TG 升高常与腹型肥胖、高血压、高血糖等并存，构成代谢综合征。
  description: 一组以肥胖、高血糖、血脂异常及高血压为特征的临床症候群。
- condition: 脂肪肝可能
  strength: medium
  note: TG 升高常伴随非酒精性脂肪性肝病，需结合肝功能及超声检查。
  description: 肝细胞内脂肪过度沉积，与胰岛素抵抗和代谢紊乱相关。
low_suggests:
- condition: 低甘油三酯血症
  strength: weak
  note: TG 过低（<0.3 mmol/L）临床意义有限，可能与营养不良、过度消耗或药物相关，需结合临床。
  description: 甘油三酯水平低于正常范围，通常无特异性症状。
clusters:
- 血脂
- 心血管风险
interventions:
- level: lifestyle
  text: 限制酒精摄入、减少精制糖和饱和脂肪摄入，增加规律有氧运动，控制体重。
  timeframe: null
  departments: []
- level: recheck
  text: 若 TG 处于边缘升高（1.7~2.3 mmol/L），建议 1~3 个月后复查，复查前 3 天保持清淡饮食。
  timeframe: 1-3个月
  departments:
  - 全科医学科
  - 健康管理中心
- level: specialist
  text: 若 TG ≥ 2.3 mmol/L，或合并心血管疾病、糖尿病、高血压等，建议专科就诊评估降脂治疗。
  timeframe: 2-4周
  departments:
  - 心血管内科
  - 内分泌科
- level: urgent
  text: 若 TG ≥ 5.6 mmol/L，急性胰腺炎风险高，建议尽快就医评估并启动降脂治疗。
  timeframe: 尽快（1周内）
  departments:
  - 消化内科
  - 急诊科
departments:
- 心血管内科
- 内分泌科
- 健康管理中心
narrative: 甘油三酯是血脂基本项目之一，主要反映体内脂质代谢及能量储备状况。其水平受近期饮食（尤其高脂、高糖饮食及酒精）影响较大，波动明显。轻度升高（1.7~2.3
  mmol/L）常与生活方式相关，可通过饮食运动干预改善；显著升高（≥2.3 mmol/L）提示代谢异常，需评估心血管风险；当 TG ≥ 5.6 mmol/L 时，急性胰腺炎风险显著增加，需积极处理。TG
  偏低通常无明确临床意义，但若同时伴体重下降或慢性消耗性疾病，需进一步排查。本内容不构成医学诊断。
