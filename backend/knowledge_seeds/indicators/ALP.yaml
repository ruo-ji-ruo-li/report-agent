narrative: 碱性磷酸酶（ALP）是肝功能检查中的常用指标，主要来源于肝脏和骨骼。血清ALP升高最常见于肝胆系统疾病，尤其是胆汁淤积性肝病和胆道梗阻，此时常伴有γ-谷氨酰转移酶（GGT）升高。此外，骨骼生长、骨折修复、骨肿瘤等骨代谢活跃状态也可导致ALP升高。儿童和青少年因骨骼发育，ALP水平通常高于成人，属正常生理现象。ALP降低相对少见，可见于遗传性低磷酸酯酶症或严重营养不良。单次ALP轻度升高不一定代表疾病，需结合其他肝功能指标及临床表现综合评估。本内容不构成医学诊断。
