high_suggests:
- condition: 肝胆疾病可能
  strength: strong
  note: 肝外胆道梗阻、肝内胆汁淤积时ALP显著升高，常伴GGT升高
  description: 包括胆石症、胆管阻塞、药物性肝损伤等
- condition: 骨骼疾病可能
  strength: medium
  note: 骨转换增加时ALP升高，如骨折愈合、Paget病、骨肿瘤等
  description: 骨代谢异常或骨损伤相关疾病
- condition: 生理性升高
  strength: weak
  note: 儿童青少年骨骼发育期、妊娠晚期可出现生理性升高
  description: 非疾病状态下的正常波动
low_suggests:
- condition: 低碱性磷酸酶血症可能
  strength: weak
  note: 罕见遗传病或严重营养不良、甲状腺功能减退等可致ALP降低
  description: ALP水平异常低下的少见情况
