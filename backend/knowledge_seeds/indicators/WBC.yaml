code: WBC
name: 白细胞计数
aliases:
- 白细胞
- WBC
- Leukocyte Count
unit: ×10⁹/L
unit_conversions: {}
category: 血常规
description: 白细胞计数是衡量外周血中白细胞总数目的指标，是炎症、感染及血液系统疾病的基础筛查项目。
