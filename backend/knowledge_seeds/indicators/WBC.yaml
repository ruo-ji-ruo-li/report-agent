interventions:
- level: recheck
  text: 若白细胞计数轻度异常（如3.0-3.5或9.5-12×10⁹/L）且无任何不适症状，建议1-2周后复查血常规，复查前避免剧烈运动、熬夜及情绪紧张。
  timeframe: 1-2周
  departments:
  - 全科医学科
  - 体检科
- level: specialist
  text: 若白细胞计数显著升高（>15×10⁹/L）或降低（<2.5×10⁹/L），或伴有发热、出血、淋巴结肿大等症状，建议尽快至血液科或感染科就诊，完善外周血涂片等检查。
  timeframe: 1周内
  departments:
  - 血液科
  - 感染科
- level: urgent
  text: 若白细胞计数低于1.0×10⁹/L或高于30×10⁹/L，且伴有高热、严重感染征象或明显出血倾向，需立即就医。
  timeframe: 立即
  departments:
  - 急诊科
  - 血液科
departments:
- 全科医学科
- 血液科
- 感染科
narrative: 白细胞计数是血常规中最基础且重要的指标之一，主要反映机体对抗感染和炎症的防御能力。其正常范围在成人中通常为(3.5-9.5)×10⁹/L，但儿童尤其是新生儿期数值会生理性偏高。白细胞计数升高最常见于细菌感染或急性应激状态，而病毒感染、部分药物及血液系统疾病则可能导致其降低。需要注意的是，单次白细胞计数轻度异常并不一定意味着疾病，剧烈运动、情绪波动、妊娠等生理因素均可引起波动。若数值显著异常或伴有发热、乏力、出血等临床症状，应结合白细胞分类计数及进一步检查综合评估。本内容不构成医学诊断。
