high_suggests:
- condition: 细菌感染风险
  strength: strong
  note: 中性粒细胞比例常同时升高，常见于化脓性球菌感染，如呼吸道、泌尿道等。
  description: 由致病细菌引发的局部或全身性炎症反应。
- condition: 急性应激或组织损伤可能
  strength: medium
  note: 如大手术、创伤、急性失血、急性溶血等，可导致反应性白细胞升高。
  description: 机体在受到严重创伤或应激状态下出现的非特异性生理反应。
- condition: 血液系统疾病风险
  strength: medium
  note: 当白细胞计数显著升高（如>50×10⁹/L）且持续存在时，需考虑白血病等骨髓增殖性疾病。
  description: 骨髓造血功能异常导致的细胞恶性增殖性疾病。
- condition: 非感染性炎症可能
  strength: weak
  note: 如类风湿关节炎、血管炎等自身免疫性疾病活动期，或使用糖皮质激素后。
  description: 免疫系统异常攻击自身组织导致的慢性炎症状态。
low_suggests:
- condition: 病毒感染风险
  strength: medium
  note: 如流感、病毒性肝炎等，病毒抑制骨髓造血或导致边缘池白细胞聚集。
  description: 由病毒入侵引起的感染性疾病，常伴发热、乏力等症状。
- condition: 药物性白细胞减少可能
  strength: medium
  note: 如使用抗甲状腺药物、部分抗生素、抗肿瘤药物等，需结合用药史。
  description: 药物作为半抗原或直接抑制骨髓造血导致的外周血白细胞减少。
- condition: 血液系统疾病风险
  strength: medium
  note: 如再生障碍性贫血、骨髓增生异常综合征等，常伴红细胞和血小板减少。
  description: 骨髓造血功能衰竭或无效造血导致的系列血细胞减少。
- condition: 脾功能亢进可能
  strength: weak
  note: 如肝硬化门脉高压、脾大等，脾脏过度滞留和破坏血细胞。
  description: 脾脏增大并过度破坏血细胞，导致外周血一系或多系减少。
clusters:
